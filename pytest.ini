[pytest]
# Two hermetic suites, no Spark / Databricks needed:
#   tests/                       — repo-side static checks (playbook config)
#   libs/dqx-validator/tests/    — validator logic (rule retrieval, FQN routing,
#                                  row-id keys, run_validation flow with Spark faked)
testpaths =
    tests
    libs/dqx-validator/tests
addopts = -q
